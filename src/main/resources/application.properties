spring.application.name=jwt-auth-system
server.port=${PORT:8080}
# Trust X-Forwarded-* from the hosting proxy (Render, Nginx), so client IPs are real.
server.forward-headers-strategy=framework

# ---------------------------------------------------------------- database
# In-memory H2 by default (no setup). For PostgreSQL set DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------------------------------------------------------- security
# HS256 signing key for access tokens: at least 32 characters. Always set your own outside local development.
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789-abcdefghij}
app.jwt.issuer=jwt-auth-system
app.jwt.access-token-ttl=${ACCESS_TOKEN_TTL:15m}

app.refresh.token-ttl=${REFRESH_TOKEN_TTL:7d}
app.refresh.cookie-name=refresh_token
# Secure cookies are only sent over HTTPS (browsers also accept them on http://localhost).
app.refresh.cookie-secure=${COOKIE_SECURE:true}

app.lockout.max-attempts=${LOCKOUT_MAX_ATTEMPTS:5}
app.lockout.duration=${LOCKOUT_DURATION:15m}

app.rate-limit.auth-requests-per-minute=${AUTH_RATE_LIMIT:20}

# Origins of a separately hosted front-end, comma-separated. Empty = same-origin only.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# One account per role (admin, moderator, user) when the database is empty.
app.demo.seed-users=${SEED_DEMO_USERS:true}

# ---------------------------------------------------------------- docs + ops
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
management.endpoints.web.exposure.include=health
